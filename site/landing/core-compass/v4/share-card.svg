<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5EFE0"/>
      <stop offset="100%" stop-color="#FAF6EB"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D85A30"/>
      <stop offset="100%" stop-color="#2C4E6B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 우측 코랄 큰 원 (장식) -->
  <circle cx="1050" cy="100" r="180" fill="#D85A30" opacity="0.06"/>
  <circle cx="100" cy="530" r="150" fill="#2C4E6B" opacity="0.05"/>

  <!-- 로고 -->
  <g transform="translate(80, 70)">
    <circle cx="14" cy="14" r="14" fill="url(#logoGrad)"/>
    <text x="40" y="22" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700" fill="#1F1F1F">Core Compass</text>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="200" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#D85A30" letter-spacing="2">MY 1ON1 BUSINESS DIAGNOSIS</text>

  <!-- 메인 인사이트 (사용자별 다름) -->
  <text x="80" y="260" font-family="Pretendard, sans-serif" font-size="48" font-weight="800" fill="#1F1F1F" letter-spacing="-1.5">나는 '실행형 솔로'</text>
  <text x="80" y="320" font-family="Pretendard, sans-serif" font-size="48" font-weight="800" fill="#1F1F1F" letter-spacing="-1.5">— 작게 만들고 빠르게.</text>

  <!-- 서브 -->
  <text x="80" y="390" font-family="Pretendard, sans-serif" font-size="20" font-weight="500" fill="#6B6B6B" letter-spacing="-0.5">90일 안에 첫 결제까지의 실행 순서 받았어요.</text>

  <!-- 6명 AI 표시 -->
  <g transform="translate(80, 470)">
    <circle cx="22" cy="22" r="22" fill="#FBE6DE"/>
    <text x="22" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#D85A30">01</text>
    <circle cx="74" cy="22" r="22" fill="rgba(122, 139, 92, 0.18)"/>
    <text x="74" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#7A8B5C">02</text>
    <circle cx="126" cy="22" r="22" fill="rgba(44, 78, 107, 0.12)"/>
    <text x="126" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#2C4E6B">03</text>
    <circle cx="178" cy="22" r="22" fill="#FBE6DE"/>
    <text x="178" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#D85A30">04</text>
    <circle cx="230" cy="22" r="22" fill="rgba(122, 139, 92, 0.18)"/>
    <text x="230" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#7A8B5C">05</text>
    <circle cx="282" cy="22" r="22" fill="rgba(44, 78, 107, 0.12)"/>
    <text x="282" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#2C4E6B">06</text>
    <text x="320" y="28" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#6B6B6B" letter-spacing="1">6 AI · 1 PAGE</text>
  </g>

  <!-- 우하단 — CTA -->
  <g transform="translate(900, 530)">
    <rect x="0" y="0" width="220" height="60" rx="12" fill="#D85A30"/>
    <text x="110" y="38" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">corecampus.kr</text>
  </g>
</svg>
