    <rect x="0" y="0" width="320" height="80" rx="16" fill="#D85A30"/>
    <text x="160" y="52" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">9,900원 진단 받기 →</text>
