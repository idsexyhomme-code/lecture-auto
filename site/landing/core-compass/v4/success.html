<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F5EFE0">
  <meta name="robots" content="noindex">
  <title>결제 완료 — Core Compass</title>

  <link rel="stylesheet" href="../../../../design-system/base.css">
  <link rel="stylesheet" href="../../../../design-system/components.css">

  <style>
    .success {
      max-width: 560px;
      margin: 0 auto;
      padding: var(--sp-16) var(--sp-5);
      text-align: center;
    }
    .success__icon {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: var(--color-coral-soft);
      color: var(--color-coral);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin: 0 auto var(--sp-6);
      animation: pop 500ms var(--easing-spring) both;
    }
    @keyframes pop {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    .success__title {
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 800;
      letter-spacing: -0.028em;
      line-height: 1.25;
      margin-bottom: var(--sp-4);
    }
    .success__sub {
      font-size: var(--fs-md);
      color: var(--color-ink-soft);
      line-height: 1.7;
      margin-bottom: var(--sp-8);
    }
    .timeline {
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--r-lg);
      padding: var(--sp-6);
      margin-bottom: var(--sp-8);
      text-align: left;
    }
    .timeline__item {
      display: flex;
      gap: var(--sp-4);
      padding: var(--sp-3) 0;
      align-items: center;
    }
    .timeline__item + .timeline__item { border-top: 1px dashed var(--color-border-soft); }
    .timeline__dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-sans-en);
      font-weight: 700;
      font-size: 14px;
    }
    .timeline__dot--done { background: var(--color-success); color: #fff; }
    .timeline__dot--now {
      background: var(--color-coral);
      color: #fff;
      box-shadow: 0 0 0 4px var(--color-coral-soft);
    }
    .timeline__dot--next {
      background: var(--color-bg-subtle);
      color: var(--color-text-muted);
      border: 1px solid var(--color-border);
    }
    .timeline__label { font-weight: 600; color: var(--color-ink); font-size: var(--fs-md); }
    .timeline__sub { font-size: var(--fs-sm); color: var(--color-text-muted); margin-top: 2px; }

    .help {
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
      line-height: 1.7;
    }
    .help a { color: var(--color-deep-blue); border-bottom: 1px dashed var(--color-deep-blue); }
  </style>
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <a class="site-logo" href="https://corecampus.kr">
      <span class="site-logo__mark"></span>
      Core Compass
    </a>
  </div>
</header>

<main>
  <section class="success">
    <div class="success__icon">✓</div>
    <h1 class="success__title">결제 완료됐어요.<br>이제 진단을 시작합니다.</h1>
    <p class="success__sub">
      <strong>{{EMAIL}}</strong>로 30분 안에 개인 URL을 보내드립니다.<br>
      메일이 안 보이면 스팸함을 한 번 확인해주세요.
    </p>

    <div class="timeline">
      <div class="timeline__item">
        <div class="timeline__dot timeline__dot--done">✓</div>
        <div>
          <div class="timeline__label">결제 완료</div>
          <div class="timeline__sub">9,900원 · {{NOW}}</div>
        </div>
      </div>
      <div class="timeline__item">
        <div class="timeline__dot timeline__dot--now">2</div>
        <div>
          <div class="timeline__label">AI 6명이 진단 중</div>
          <div class="timeline__sub">5~10분 소요</div>
        </div>
      </div>
      <div class="timeline__item">
        <div class="timeline__dot timeline__dot--next">3</div>
        <div>
          <div class="timeline__label">개인 URL 이메일 도착</div>
          <div class="timeline__sub">결제 후 30분 안 (대부분 10분 안)</div>
        </div>
      </div>
      <div class="timeline__item">
        <div class="timeline__dot timeline__dot--next">4</div>
        <div>
          <div class="timeline__label">진단 리포트 열람</div>
          <div class="timeline__sub">24시간 재열람 가능</div>
        </div>
      </div>
    </div>

    <p class="help">
      30분이 지나도 이메일이 오지 않으면 <a href="mailto:support@corecampus.kr">support@corecampus.kr</a>로 결제 영수증과 함께 알려주세요. 1시간 안에 다시 발송해드립니다.
    </p>
  </section>
</main>

</body>
</html>
