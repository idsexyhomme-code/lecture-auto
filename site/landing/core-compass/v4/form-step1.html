<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F5EFE0">
  <meta name="robots" content="noindex">
  <title>진단 시작 1/3 — Core Compass</title>
  <link rel="stylesheet" href="../../../../design-system/base.css">
  <link rel="stylesheet" href="../../../../design-system/components.css">

  <style>
    .form-page { max-width: 520px; margin: 0 auto; padding: var(--sp-8) var(--sp-5); }
    .form-page__title { font-size: clamp(20px, 4vw, 28px); font-weight: 800; letter-spacing: -0.025em; margin-bottom: var(--sp-3); }
    .form-page__sub { font-size: var(--fs-md); color: var(--color-text-muted); margin-bottom: var(--sp-6); line-height: 1.7; }
    .field-group { margin-bottom: var(--sp-6); }
    .field-label { font-size: var(--fs-sm); font-weight: 600; color: var(--color-ink-soft); margin-bottom: var(--sp-2); letter-spacing: -0.012em; }
    .chip-row { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
    .chip-radio {
      position: relative;
      display: inline-flex; align-items: center;
      padding: var(--sp-3) var(--sp-5);
      background: var(--color-bg-card); border: 1px solid var(--color-border);
      border-radius: var(--r-full); cursor: pointer;
      font-size: var(--fs-sm); font-weight: 500;
      transition: all var(--duration-base);
    }
    .chip-radio input { position: absolute; opacity: 0; pointer-events: none; }
    .chip-radio:has(input:checked) { background: var(--color-coral); color: #fff; border-color: var(--color-coral); }
    .chip-radio:hover { border-color: var(--color-coral); }
    .progress-bar-mini { background: var(--color-bg-subtle); border-radius: var(--r-full); height: 8px; margin-bottom: var(--sp-6); overflow: hidden; }
    .progress-bar-mini__fill { background: var(--color-coral); height: 100%; transition: width var(--duration-base); }
  </style>
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <a class="site-logo" href="https://corecampus.kr"><span class="site-logo__mark"></span>Core Compass</a>
    <span class="badge badge--blue">1 / 3</span>
  </div>
</header>

<main>
  <div class="form-page">
    <div class="progress-bar-mini"><div class="progress-bar-mini__fill" style="width: 33%;"></div></div>

    <h1 class="form-page__title">{{USER_NAME}}님, 진단 시작할게요.</h1>
    <p class="form-page__sub">이번 주 몇 시간 정도 사업에 쏟을 수 있으신가요?</p>

    <form id="step1-form">
      <div class="field-group">
        <div class="field-label">주당 가용 시간</div>
        <div class="chip-row">
          <label class="chip-radio"><input type="radio" name="hours" value="3" required>주 3시간 이하 (틈틈이)</label>
          <label class="chip-radio"><input type="radio" name="hours" value="10">주 5~10시간 (저녁·주말)</label>
          <label class="chip-radio"><input type="radio" name="hours" value="20">주 10~20시간 (반전업)</label>
          <label class="chip-radio"><input type="radio" name="hours" value="40">주 20시간 이상 (전업)</label>
        </div>
      </div>

      <div class="field-group">
        <div class="field-label">관심 분야 (3개까지)</div>
        <div class="chip-row">
          <label class="chip-radio"><input type="checkbox" name="interests" value="ai">AI 자동화·툴</label>
          <label class="chip-radio"><input type="checkbox" name="interests" value="content">콘텐츠 (블로그·뉴스레터)</label>
          <label class="chip-radio"><input type="checkbox" name="interests" value="design">디자인·영상</label>
          <label class="chip-radio"><input type="checkbox" name="interests" value="education">교육·코칭</label>
          <label class="chip-radio"><input type="checkbox" name="interests" value="ecommerce">전자상거래</label>
          <label class="chip-radio"><input type="checkbox" name="interests" value="service">전문 서비스</label>
        </div>
      </div>

      <button type="submit" class="btn btn--primary btn--lg btn--block">다음 →</button>
    </form>
  </div>
</main>

<script>
  // 폼 데이터 sessionStorage 저장
  document.getElementById('step1-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = { hours: fd.get('hours'), interests: fd.getAll('interests') };
    sessionStorage.setItem('compass_step1', JSON.stringify(data));
    window.location.href = 'form-step2.html';
  });
</script>
</body>
</html>
