<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F5EFE0">
  <meta name="robots" content="noindex">
  <title>결제 — Core Compass</title>

  <link rel="stylesheet" href="../../../../design-system/base.css">
  <link rel="stylesheet" href="../../../../design-system/components.css">

  <style>
    .checkout-page {
      max-width: 520px;
      margin: 0 auto;
      padding: var(--sp-12) var(--sp-5);
    }
    .checkout-page__title {
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: var(--sp-6);
      text-align: center;
    }

    .product-summary {
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--r-lg);
      padding: var(--sp-5);
      margin-bottom: var(--sp-6);
    }
    .product-summary__row {
      display: flex;
      justify-content: space-between;
      padding: var(--sp-2) 0;
      font-size: var(--fs-md);
    }
    .product-summary__row--total {
      border-top: 1px dashed var(--color-border);
      margin-top: var(--sp-2);
      padding-top: var(--sp-3);
      font-weight: 700;
      font-size: var(--fs-lg);
      color: var(--color-coral);
    }
    .product-summary__row .tg-num {
      font-family: var(--font-sans-en);
      font-weight: 600;
    }

    .checkout-form { display: flex; flex-direction: column; gap: var(--sp-4); }
    .field { display: flex; flex-direction: column; gap: var(--sp-1); }
    .field__label {
      font-size: var(--fs-sm);
      font-weight: 600;
      color: var(--color-ink-soft);
      letter-spacing: -0.012em;
    }
    .field__input {
      padding: var(--sp-3) var(--sp-4);
      border: 1px solid var(--color-border);
      border-radius: var(--r-md);
      font-family: var(--font-sans-kr);
      font-size: var(--fs-md);
      background: var(--color-bg-card);
      letter-spacing: -0.012em;
      transition: border-color var(--duration-fast);
    }
    .field__input:focus { border-color: var(--color-coral); outline: none; }
    .field__hint { font-size: var(--fs-xs); color: var(--color-text-muted); margin-top: 2px; }

    .agreements {
      background: var(--color-bg-subtle);
      border-radius: var(--r-md);
      padding: var(--sp-4);
      margin: var(--sp-4) 0;
      font-size: var(--fs-sm);
    }
    .agreement { display: flex; align-items: flex-start; gap: var(--sp-2); padding: var(--sp-1) 0; }
    .agreement__check { margin-top: 4px; }

    .footer-note {
      text-align: center;
      margin-top: var(--sp-6);
      font-size: var(--fs-xs);
      color: var(--color-text-muted);
      line-height: 1.7;
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="site-header__inner">
    <a class="site-logo" href="https://corecampus.kr">
      <span class="site-logo__mark"></span>
      Core Compass
    </a>
  </div>
</header>

<main>
  <div class="checkout-page">
    <h1 class="checkout-page__title">결제하고 진단 받기</h1>

    <!-- 상품 요약 -->
    <div class="product-summary">
      <div class="product-summary__row">
        <span>Core Compass — 1페이지 AI 진단 리포트</span>
        <span class="tg-num">₩9,900</span>
      </div>
      <div class="product-summary__row">
        <span>출시 프로모션 할인</span>
        <span class="tg-num">-₩0</span>
      </div>
      <div class="product-summary__row product-summary__row--total">
        <span>총 결제 금액</span>
        <span class="tg-num">₩9,900</span>
      </div>
    </div>

    <!-- 폼 -->
    <form class="checkout-form" id="checkout-form">
      <div class="field">
        <label class="field__label" for="email">이메일</label>
        <input type="email" class="field__input" id="email" name="email" placeholder="example@email.com" required>
        <span class="field__hint">결제 후 30분 안에 이 이메일로 개인 URL을 보내드립니다.</span>
      </div>

      <div class="field">
        <label class="field__label" for="name">이름 (선택)</label>
        <input type="text" class="field__input" id="name" name="name" placeholder="홍길동">
        <span class="field__hint">리포트에 표시될 이름입니다.</span>
      </div>

      <!-- 약관 -->
      <div class="agreements">
        <label class="agreement">
          <input type="checkbox" class="agreement__check" required>
          <span><strong>(필수)</strong> 결제 진행 동의 — 9,900원 결제 후 30분 이내 개인 URL 발송</span>
        </label>
        <label class="agreement">
          <input type="checkbox" class="agreement__check" required>
          <span><strong>(필수)</strong> 환불 정책 동의 — 개인 URL 발송 전 100% 환불, 발송 후 환불 어려움</span>
        </label>
        <label class="agreement">
          <input type="checkbox" class="agreement__check">
          <span>(선택) 이메일 마케팅 수신 동의 — 월 1~2회 신상품·할인 안내</span>
        </label>
      </div>

      <button type="submit" class="btn btn--primary btn--lg btn--block" id="pay-btn">
        ₩9,900 결제하기
      </button>
    </form>

    <p class="footer-note">
      결제는 페이앱 안전결제로 진행됩니다.<br>
      카드·계좌이체·카카오페이·네이버페이·삼성페이 지원.
    </p>
  </div>
</main>

<script>
  // 페이앱 결제 호출 (스켈레톤 — 실제 키는 서버 사이드)
  document.getElementById('checkout-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const name = document.getElementById('name').value || '회원';

    // 실제 구현: 서버에 POST → 페이앱 결제 요청 ID 받음 → 페이앱 URL로 리디렉트
    // 여기는 스켈레톤 — 회원이 실제 키 입력 후 작동
    alert(`[페이앱 결제 호출 예정]\n\nEmail: ${email}\nName: ${name}\n금액: 9,900원\n\n실제 결제는 페이앱 SHOP_ID 입력 후 작동합니다.`);

    // 페이앱 호출 예시 (회원이 키 입력 후):
    /*
    fetch('/api/payment/payapp/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email, name,
        product: 'core-compass',
        amount: 9900,
      })
    })
    .then(r => r.json())
    .then(data => {
      window.location.href = data.payapp_url;
    });
    */
  });
</script>

</body>
</html>
