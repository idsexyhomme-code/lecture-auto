<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F5EFE0">
  <meta name="robots" content="noindex">
  <title>결제 — 코어 캠퍼스</title>

  <link rel="stylesheet" href="../../../design-system/base.css">
  <link rel="stylesheet" href="../../../design-system/components.css">

  <!-- 토스페이먼츠 Widget SDK -->
  <script src="https://js.tosspayments.com/v1/payment-widget"></script>

  <style>
    .checkout-page {
      max-width: 560px;
      margin: 0 auto;
      padding: var(--sp-12) var(--sp-5);
    }
    .checkout-page__title {
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: var(--sp-6);
      text-align: center;
    }
    .product-summary {
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--r-lg);
      padding: var(--sp-5);
      margin-bottom: var(--sp-6);
    }
    .product-summary__row {
      display: flex;
      justify-content: space-between;
      padding: var(--sp-2) 0;
    }
    .product-summary__row--total {
      border-top: 1px dashed var(--color-border);
      margin-top: var(--sp-2);
      padding-top: var(--sp-3);
      font-weight: 700;
      font-size: var(--fs-lg);
      color: var(--color-coral);
    }
    .product-summary__row .tg-num { font-family: var(--font-sans-en); font-weight: 600; }

    #payment-method, #agreement {
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--r-md);
      padding: var(--sp-4);
      margin-bottom: var(--sp-4);
    }

    .field { display: flex; flex-direction: column; gap: var(--sp-1); margin-bottom: var(--sp-4); }
    .field__label { font-size: var(--fs-sm); font-weight: 600; color: var(--color-ink-soft); }
    .field__input {
      padding: var(--sp-3) var(--sp-4);
      border: 1px solid var(--color-border);
      border-radius: var(--r-md);
      font-family: var(--font-sans-kr);
      font-size: var(--fs-md);
      background: var(--color-bg-card);
    }
    .field__input:focus { border-color: var(--color-coral); outline: none; }

    .footer-note {
      text-align: center;
      margin-top: var(--sp-6);
      font-size: var(--fs-xs);
      color: var(--color-text-muted);
      line-height: 1.7;
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="site-header__inner">
    <a class="site-logo" href="/site/index.html">
      <span class="site-logo__mark"></span>
      코어 캠퍼스
    </a>
  </div>
</header>

<main>
  <div class="checkout-page">
    <h1 class="checkout-page__title">결제하기</h1>

    <div class="product-summary">
      <div class="product-summary__row">
        <span id="product-name">코스명 로딩 중…</span>
        <span class="tg-num" id="product-price">₩-</span>
      </div>
      <div class="product-summary__row product-summary__row--total">
        <span>총 결제 금액</span>
        <span class="tg-num" id="total-price">₩-</span>
      </div>
    </div>

    <div class="field">
      <label class="field__label" for="email">이메일</label>
      <input type="email" class="field__input" id="email" placeholder="example@email.com" required>
    </div>

    <!-- 토스 Widget — 결제 수단 선택 -->
    <div id="payment-method"></div>

    <!-- 토스 Widget — 이용약관 동의 -->
    <div id="agreement"></div>

    <button class="btn btn--primary btn--lg btn--block" id="pay-btn" disabled>
      결제하기
    </button>

    <p class="footer-note">
      결제는 토스페이먼츠 안전결제로 진행됩니다.<br>
      카드·간편결제·계좌이체 지원. SSL 보호.
    </p>
  </div>
</main>

<script>
  // URL 파라미터 파싱
  const params = new URLSearchParams(window.location.search);
  const productId = params.get('product') || '';
  const amount = parseInt(params.get('amount') || '49000', 10);
  const email = params.get('email') || '';
  const orderId = params.get('order') || `order_${Date.now()}`;

  // 화면 채우기
  document.getElementById('product-name').textContent = productNameFor(productId);
  document.getElementById('product-price').textContent = `₩${amount.toLocaleString()}`;
  document.getElementById('total-price').textContent = `₩${amount.toLocaleString()}`;
  if (email) document.getElementById('email').value = email;

  function productNameFor(id) {
    const map = {
      'claude-launchpad': '부캐 서비스 7일 런칭',
      'claude-autowork': '반복 업무 시간 줄이기 실전',
      'claude-bizflow': '혼자 일하면서 시간 늘리기',
    };
    return map[id] || id;
  }

  // 토스 Widget 초기화 — 클라이언트키는 환경변수 주입 필요 (회원 입력 후)
  const TOSS_CLIENT_KEY = window.TOSS_CLIENT_KEY || 'test_ck_PLACEHOLDER';

  let widget;
  try {
    widget = PaymentWidget(TOSS_CLIENT_KEY, PaymentWidget.ANONYMOUS);
    widget.renderPaymentMethods('#payment-method', { value: amount });
    widget.renderAgreement('#agreement');
    document.getElementById('pay-btn').disabled = false;
  } catch (e) {
    console.error('Toss widget failed:', e);
    document.getElementById('payment-method').innerHTML =
      '<p style="color: var(--color-danger); padding: 16px;">⚠ 토스페이먼츠 키가 설정되지 않았습니다. .env에 TOSS_CLIENT_KEY 입력 필요.</p>';
  }

  document.getElementById('pay-btn').addEventListener('click', async () => {
    const emailVal = document.getElementById('email').value;
    if (!emailVal) { alert('이메일을 입력하세요.'); return; }
    try {
      await widget.requestPayment({
        orderId: orderId,
        orderName: productNameFor(productId),
        successUrl: window.location.origin + '/site/landing/core-compass/v3/success.html',
        failUrl: window.location.origin + '/site/landing/checkout-toss/?fail=1',
        customerEmail: emailVal,
      });
    } catch (e) {
      alert('결제 요청 실패: ' + e.message);
    }
  });
</script>

</body>
</html>
